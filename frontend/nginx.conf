server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers. nginx drops these in a location that sets its own add_header,
  # so the snippet is repeated wherever a location adds a header.
  set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; frame-src blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'";
  add_header Content-Security-Policy $csp always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # API requests are forwarded to the Node container
  location /api/ {
    proxy_pass http://api:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 10m;
    proxy_read_timeout 90s;
  }

  # Hashed build assets can be cached for a long time
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  # The service worker must always be fresh, or an update could never arrive
  location = /sw.js {
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Single-page application: every other path returns index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
